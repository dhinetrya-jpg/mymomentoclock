apiVersion: apps/v1
kind: Deployment
metadata:
  name: mymomentoclock-api
  namespace: astro-production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mymomentoclock-api
  template:
    metadata:
      labels:
        app: mymomentoclock-api
      annotations:
        prometheus.io/scrape: 'false'
        prometheus.io/port: '8080'
    spec:
      containers:
      - name: api-container
        image: YOUR_CONTAINER_REGISTRY/mymomentoclock-core:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 512Mi
            cpu: 500m
        envFrom:
        - configMapRef:
            name: mymomentoclock-config
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
            - ALL
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: mymomentoclock-api-service
  namespace: astro-production
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: mymomentoclock-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mymomentoclock-ingress
  namespace: astro-production
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: nginx
  rules:
  - host: api.mymomentoclock.production
    http:
      paths:
      - path: /api/v1/ephemeris/normalize
        pathType: Exact
        backend:
          service:
            name: mymomentoclock-api-service
            port:
              number: 8080
  tls:
  - hosts:
    - api.mymomentoclock.production
    secretName: mymomentoclock-api-tls
