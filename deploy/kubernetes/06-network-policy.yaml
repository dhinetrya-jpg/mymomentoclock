apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-isolation
  namespace: astro-production
spec:
  podSelector:
    matchLabels:
      app: mymomentoclock-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inactive-datastore-isolation
  namespace: astro-production
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [postgres, neo4j]
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
