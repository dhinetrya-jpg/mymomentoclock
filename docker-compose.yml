# Default stack is stateless and payment-disabled. Databases/monitoring are opt-in development tools.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports: ["127.0.0.1:3000:3000"]
    environment:
      NODE_ENV: production
      PORT: "3000"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
