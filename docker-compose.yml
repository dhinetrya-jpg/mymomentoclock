# Default stack is stateless and payment-disabled. Databases/monitoring are opt-in development tools.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports: ["127.0.0.1:3000:3000"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Opt-in native CGo bridge: set NATIVE_ENGINE_URL="http://api:8080" only when `api` mounts a reviewed ASTRONOMY_NATIVE_CONFIG_FILE.
      NATIVE_ENGINE_URL: "${NATIVE_ENGINE_URL:-}"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ASTRONOMY_NATIVE_CONFIG_FILE: "${ASTRONOMY_NATIVE_CONFIG_FILE:-}"
      INTERNAL_TLS_ADDR: "${INTERNAL_TLS_ADDR:-}"
      INTERNAL_TLS_CA_FILE: "${INTERNAL_TLS_CA_FILE:-}"
      INTERNAL_TLS_CERT_FILE: "${INTERNAL_TLS_CERT_FILE:-}"
      INTERNAL_TLS_KEY_FILE: "${INTERNAL_TLS_KEY_FILE:-}"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
# No payment service/database/worker is started here. Future payment internal transport
# requires dedicated mTLS certificate mounts, secret DSN with verify-full, private networking,
# real reviewed adapters and owner-approved activation. See docs/payment deployment runbook.
