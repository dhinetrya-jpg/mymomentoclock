name: MymomentOclock API Smoke and Optional Load Validation
on:
  push:
    branches: [main, master]
    paths: ['tests/stress/**', 'server.ts', 'src/engine/**', 'package*.json', '.github/workflows/mymomentoclock-matrix-pipeline.yml']
  pull_request:
    branches: [main, master]
    paths: ['tests/stress/**', 'server.ts', 'src/engine/**', 'package*.json', '.github/workflows/mymomentoclock-matrix-pipeline.yml']
  workflow_dispatch:
    inputs:
      profile:
        description: 'Smoke by default; stress runs the original 10,000-VU profile'
        type: choice
        options: [smoke, stress]
        default: smoke
jobs:
  api-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start production server
        env:
          PORT: 8080
          NODE_ENV: production
        run: |
          npm run start > /tmp/mymomentoclock.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/mymomentoclock.log
          exit 1
      - uses: grafana/setup-k6-action@v1
      - name: Run API checks
        env:
          TARGET_URL: http://localhost:8080
          TEST_PROFILE: ${{ inputs.profile || 'smoke' }}
        run: k6 run tests/stress/load_profile.js
      - name: Show server diagnostics on failure
        if: failure()
        run: cat /tmp/mymomentoclock.log
