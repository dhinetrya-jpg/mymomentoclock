name: Phase 1 native and durable payment security
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  isolated-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Native Go tests, race detection, vet and isolated PostgreSQL recovery
        run: scripts/test-phase1-go.sh
