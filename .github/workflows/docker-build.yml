name: Docker Image Build Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    name: Test Docker Container Build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mymomentoclock:latest
          load: true

      - name: Compile and test root Go module with Swiss Ephemeris
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: root-tests
          push: false

      - name: Build full-stack web deployment image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: false
          load: true
          tags: mymomentoclock-web:latest

      - name: Build disabled commercial native artifact
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: commercial
          push: false
          load: true
          tags: payment-commercial-check:latest
      - name: Commercial default refuses activation
        run: |
          if docker run --rm payment-commercial-check:latest > /tmp/payment-commercial-refusal.log 2>&1; then exit 1; fi
          grep -q COMMERCIAL_CONFIGURATION_UNAPPROVED /tmp/payment-commercial-refusal.log
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test both production images
        run: |
          docker run -d --name engine -p 127.0.0.1:18080:8080 mymomentoclock:latest
          docker run -d --name web -p 127.0.0.1:13000:3000 mymomentoclock-web:latest
          node tests/deployment/smoke.mjs engine http://127.0.0.1:18080
          node tests/deployment/smoke.mjs web http://127.0.0.1:13000
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs engine || true
          docker logs web || true
          docker rm -f engine web || true
