name: CI - Lint & Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Lint Check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Lint & Typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Typecheck and build alternate frontend
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run build

      - name: Calculation integrity & astronomical accuracy regression tests
        run: node --import ./tests/calculation/register-assets.mjs --import tsx --test tests/calculation/integrity.test.tsx tests/calculation/astronomical_accuracy.test.ts

      - name: Phase 1 security and privacy regression
        run: node --import tsx --test tests/phase1/security.test.ts
      - name: Payment boundary and checkout contract tests
        run: node --import tsx --test tests/payment/boundary.test.ts tests/payment/pay02.test.tsx tests/payment/pay03.test.tsx
      - name: Desktop and mobile production browser regression
        run: |
          NODE_ENV=production PORT=3101 node --import tsx server.ts > /tmp/phase1-browser-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3101/health; then break; fi
            sleep 1
          done
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          PHASE1_WEB_URL=http://127.0.0.1:3101 node tests/phase1/browser.mjs
          node tests/payment/pay03-browser.mjs
